name: SM-P580 Ultra-Lite ROM Builder

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'LineageOS / eOS Taban ROM Zip Linki'
        required: true
        default: 'https://github.com/Karchsn05/smp580-ultra-lite/releases/download/base-rom/base_rom.zip'
      release_tag:
        description: 'Sürüm Etiketi (Release Tag)'
        required: true
        default: 'v1.0-ultra-lite-ios'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Runner Disk Alanını Genişlet
        run: |
          echo "Gereksiz runner paketleri temizleniyor..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache
          df -h

      - name: Gerekli Linux Paketlerini Kur
        run: |
          sudo apt update
          sudo apt install -y brotli lz4 zip unzip wget curl file python3 python3-pip openjdk-11-jdk jq
          pip3 install --upgrade pip requests

      - name: Taban ROM'u İndir ve Doğrula
        run: |
          mkdir -p workspace/unpacked
          cd workspace
          echo "ROM İndiriliyor: ${{ github.event.inputs.rom_url }}"
          
          # GitHub Releases'ten yüksek hızla indir
          curl -L --retry 5 -A "Mozilla/5.0" "${{ github.event.inputs.rom_url }}" -o rom.zip
          
          echo "Dosya bütünlüğü kontrol ediliyor..."
          file rom.zip
          ls -lh rom.zip
          
          unzip -tq rom.zip
          
          echo "ROM zip paketi açılıyor..."
          unzip -q rom.zip -d unpacked/
          ls -la unpacked/

      - name: Sistem Dosyalarını Çıkar (sdat2img / Mount)
        run: |
          cd workspace/unpacked
          
          if [ -f "system.new.dat.br" ]; then
            echo "[*] system.new.dat.br brotli ile açılıyor..."
            brotli -d system.new.dat.br
          fi

          wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py -O sdat2img.py
          
          if [ -f "system.transfer.list" ] && [ -f "system.new.dat" ]; then
            echo "[*] system.new.dat -> system.img dönüştürülüyor..."
            python3 sdat2img.py system.transfer.list system.new.dat system.img
            mkdir -p system_mnt
            sudo mount -o loop,rw system.img system_mnt || true
          fi

      - name: Gömülü Açık Kaynak Paketleri İndir (Cromite, microG, K-9 Mail, Neo Launcher)
        run: |
          SYS_DIR="workspace/unpacked/system_mnt"
          if [ -d "$SYS_DIR/system" ]; then
            SYS_ROOT="$SYS_DIR/system"
          elif [ -d "$SYS_DIR" ]; then
            SYS_ROOT="$SYS_DIR"
          elif [ -d "workspace/unpacked/system" ]; then
            SYS_ROOT="workspace/unpacked/system"
          else
            SYS_ROOT="workspace/unpacked"
          fi

          echo "Hedef Sistem Kökü: $SYS_ROOT"
          sudo mkdir -p "$SYS_ROOT/app/Cromite"
          sudo mkdir -p "$SYS_ROOT/app/K9Mail"
          sudo mkdir -p "$SYS_ROOT/app/NeoLauncher"
          sudo mkdir -p "$SYS_ROOT/priv-app/GmsCore"
          sudo mkdir -p "$SYS_ROOT/priv-app/GsfProxy"
          sudo mkdir -p "$SYS_ROOT/priv-app/FakeStore"

          echo "[*] Cromite (arm64-v8a) indiriliyor..."
          CROMITE_URL=$(curl -s https://api.github.com/repos/uazo/cromite/releases/latest | jq -r '.assets[] | select(.name | contains("arm64_ChromePublic.apk")) | .browser_download_url' | head -n 1)
          if [ -n "$CROMITE_URL" ] && [ "$CROMITE_URL" != "null" ]; then
            sudo curl -sL -A "Mozilla/5.0" "$CROMITE_URL" -o "$SYS_ROOT/app/Cromite/Cromite.apk" || true
          fi

          echo "[*] K-9 Mail / Thunderbird indiriliyor..."
          K9_URL=$(curl -s https://api.github.com/repos/thunderbird/thunderbird-android/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          if [ -n "$K9_URL" ] && [ "$K9_URL" != "null" ]; then
            sudo curl -sL -A "Mozilla/5.0" "$K9_URL" -o "$SYS_ROOT/app/K9Mail/K9Mail.apk" || true
          fi

          echo "[*] Neo Launcher indiriliyor..."
          NEO_URL=$(curl -s https://api.github.com/repos/NeoApplications/Neo-Launcher/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          if [ -n "$NEO_URL" ] && [ "$NEO_URL" != "null" ]; then
            sudo curl -sL -A "Mozilla/5.0" "$NEO_URL" -o "$SYS_ROOT/app/NeoLauncher/NeoLauncher.apk" || true
          fi

          echo "[*] microG Suite indiriliyor..."
          sudo curl -sL "https://github.com/microg/GmsCore/releases/download/v0.3.4.240913/com.google.android.gms-240913008.apk" -o "$SYS_ROOT/priv-app/GmsCore/GmsCore.apk" || true
          sudo curl -sL "https://github.com/microg/GsfProxy/releases/download/v0.1.0/GsfProxy.apk" -o "$SYS_ROOT/priv-app/GsfProxy/GsfProxy.apk" || true
          sudo curl -sL "https://github.com/microg/FakeStore/releases/download/v0.1.0/FakeStore.apk" -o "$SYS_ROOT/priv-app/FakeStore/FakeStore.apk" || true

          sudo chmod -R 755 "$SYS_ROOT/app" "$SYS_ROOT/priv-app"

      - name: Optimizasyon ve Mimari Scriptini Çalıştır
        run: |
          chmod +x ./scripts/optimize.sh
          
          if [ -d "workspace/unpacked/system_mnt/system" ]; then
            sudo ./scripts/optimize.sh workspace/unpacked/system_mnt/system
          elif [ -d "workspace/unpacked/system_mnt" ]; then
            sudo ./scripts/optimize.sh workspace/unpacked/system_mnt
          elif [ -d "workspace/unpacked/system" ]; then
            ./scripts/optimize.sh workspace/unpacked/system
          else
            ./scripts/optimize.sh workspace/unpacked
          fi

      - name: img2sdat ve TWRP Flashable Zip Paketleme
        run: |
          cd workspace/unpacked
          
          if mountpoint -q system_mnt; then
            echo "[*] system_mnt unmount ediliyor..."
            sudo umount system_mnt
            
            wget -q https://raw.githubusercontent.com/xpirt/img2sdat/master/img2sdat.py -O img2sdat.py
            echo "[*] system.img -> system.new.dat dönüştürülüyor..."
            python3 img2sdat.py system.img -v 4 -o ./
            
            echo "[*] brotli ile sıkıştırılıyor..."
            brotli -q 6 system.new.dat -o system.new.dat.br
            
            rm -f system.img system.new.dat sdat2img.py img2sdat.py
            sudo rm -rf system_mnt
          fi
          
          echo "[*] Yeni Flashable TWRP zip oluşturuluyor..."
          ZIP_NAME="SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip"
          zip -r -9 "../$ZIP_NAME" ./*
          cd ..
          ls -lh "$ZIP_NAME"
          sha256sum "$ZIP_NAME" > checksum.txt

      - name: GitHub Releases Olarak Yayınla
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "SM-P580 Ultra-Lite (iOS-Tuned Edition) - ${{ github.event.inputs.release_tag }}"
          body: |
            ## 🚀 Samsung Galaxy Tab A 10.1 (SM-P580 / Exynos 7870) Ultra-Lite Edition
            
            ### ✨ Uygulanan Mühendislik Optimizasyonları:
            * 🍎 **iOS Dokunmatik Akıcılığı:** `sys.use_fifo_ui=1`, SkiaGL GPU render (`debug.hwui.renderer=skiagl`), 0.6x yay animasyonları ve sıfır mikro-takılma.
            * 🛡️ **microG & İmza Sahteciliği:** GmsCore, GsfProxy, FakeStore ve Signature Spoofing izinleri fabrika çıkışı entegre.
            * 🌐 **Gömülü Cromite (arm64-v8a):** Reklam/izleyici engelleyicili, donanım hızlandırmalı ve bellek sızıntısız web motoru.
            * ✉️ **Gömülü Thunderbird / K-9 Mail:** microG'den bağımsız çalışan IMAP IDLE push destekli açık kaynaklı e-posta istemcisi.
            * 🎨 **Neo Launcher (AOSP Launcher3 Tabanlı):** Google Feed'siz, temiz dock/grid düzenli hafif arayüz.
            * 💾 **A2 V30 MicroSD + 1.5GB ZRAM Çift Katmanlı Bellek:** ZRAM (Prio 32767) + A2 SD Kart Swap (Prio 10) ile sıfır takılma & donma.
            * 🖥️ **Masaüstü Modu (AOSP Freeform Windows):** Yan yana boyutlandırılabilir pencereler.
            
            ### 📲 Kurulum Adımları (TWRP):
            1. Tabletinizi **TWRP Recovery** modunda başlatın.
            2. `Wipe` -> `Advanced Wipe` -> `Dalvik/ART Cache`, `Cache`, `System`, `Data` alanlarını temizleyin.
            3. İndirdiğiniz `.zip` dosyasını `Install` menüsünden yükleyin.
            4. Cihazınızı yeniden başlatın.
          files: |
            workspace/SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip
            workspace/checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
