name: SM-P580 Ultra-Lite ROM Builder

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'LineageOS / Custom ROM Doğrudan İndirme Linki (Direct Zip URL)'
        required: true
        default: 'https://master.dl.sourceforge.net/project/lineageos-17-for-gtaxlwifi/LineageOS-17.1/lineage-17.1-20210214-UNOFFICIAL-gtanotexlwifi.zip?viasf=1'
      release_tag:
        description: 'Sürüm Etiketi (Release Tag)'
        required: true
        default: 'v1.0-ultra-lite'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Disk Alanını Genişlet (Runner Clean Up)
        run: |
          echo "Disk alanı temizleniyor..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache
          df -h

      - name: Gerekli Linux Paketlerini Kur
        run: |
          sudo apt update
          sudo apt install -y brotli lz4 zip unzip wget curl file python3 python3-pip openjdk-11-jdk
          pip3 install --upgrade pip

      - name: ROM İndirme ve Açma
        run: |
          mkdir -p workspace/unpacked
          cd workspace
          echo "ROM indiriliyor: ${{ github.event.inputs.rom_url }}"
          wget --no-check-certificate -q --show-progress -O rom.zip "${{ github.event.inputs.rom_url }}"
          
          echo "ROM zip paketi açılıyor..."
          unzip -q rom.zip -d unpacked/
          ls -la unpacked/

      - name: Sistem Dosyalarını Çıkar (sdat2img / brotli / raw img)
        run: |
          cd workspace/unpacked
          
          # Eğer system.new.dat.br varsa brotli ile aç
          if [ -f "system.new.dat.br" ]; then
            echo "[*] system.new.dat.br decompress ediliyor..."
            brotli -d system.new.dat.br
          fi

          # sdat2img aracını indir
          wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py -O sdat2img.py
          
          if [ -f "system.transfer.list" ] && [ -f "system.new.dat" ]; then
            echo "[*] system.new.dat -> system.img dönüştürülüyor..."
            python3 sdat2img.py system.transfer.list system.new.dat system.img
            mkdir -p system_mnt
            sudo mount -o loop,rw system.img system_mnt || true
          fi

      - name: Optimizasyon Scriptini Uygula
        run: |
          chmod +x ./scripts/optimize.sh
          
          if [ -d "workspace/unpacked/system_mnt/system" ]; then
            sudo ./scripts/optimize.sh workspace/unpacked/system_mnt/system
          elif [ -d "workspace/unpacked/system_mnt" ]; then
            sudo ./scripts/optimize.sh workspace/unpacked/system_mnt
          elif [ -d "workspace/unpacked/system" ]; then
            ./scripts/optimize.sh workspace/unpacked/system
          else
            ./scripts/optimize.sh workspace/unpacked
          fi

      - name: img2sdat ve Tekrar Paketleme
        run: |
          cd workspace/unpacked
          
          if mountpoint -q system_mnt; then
            echo "[*] system_mnt unmount ediliyor..."
            sudo umount system_mnt
            
            # img2sdat ile tekrar sparse dat yap
            wget -q https://raw.githubusercontent.com/xpirt/img2sdat/master/img2sdat.py -O img2sdat.py
            echo "[*] system.img -> system.new.dat dönüştürülüyor..."
            python3 img2sdat.py system.img -v 4 -o ./
            
            echo "[*] brotli ile sıkıştırılıyor..."
            brotli -q 6 system.new.dat -o system.new.dat.br
            
            # Temizlik
            rm -f system.img system.new.dat sdat2img.py img2sdat.py
            sudo rm -rf system_mnt
          fi
          
          echo "[*] Yeni Flashable TWRP zip oluşturuluyor..."
          zip -r -9 ../SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip ./*
          cd ..
          ls -lh SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip
          sha256sum SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip > checksum.txt

      - name: GitHub Releases'a Yükle
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "SM-P580 Ultra-Lite (iOS-Tuned) - ${{ github.event.inputs.release_tag }}"
          body: |
            ## 🚀 Samsung Galaxy Tab A 10.1 (SM-P580) - Ultra-Lite & Smooth Edition
            
            ### ✨ Uygulanan Mühendislik Optimizasyonları:
            * ⚡ **iOS Tarzı Dokunma Önceliği:** `sys.use_fifo_ui=1` ve düşük gecikmeli UI render iş parçacığı.
            * 🚀 **GPU Donanım Hızlandırma:** Mali-T830 SurfaceFlinger doğrudan render & 60 FPS pürüzsüz kaydırma.
            * 🧹 **Derin Debloat:** RAM tüketen arka plan Google ve gereksiz telemetri servisleri tamamen temizlendi.
            * 🛡️ **Sistem Düzeyinde Reklam Engelleme:** `/etc/hosts` seviyesinde reklam/izleyici filtreleme (Web sayfaları %50 daha hızlı yüklenir).
            * 💾 **1.5 GB ZRAM (LZ4) Desteği:** Çoklu sekme açıldığında donma ve sayfa kapanmalarını önleyen bellek sıkıştırması.
            * 🖥️ **Masaüstü Pencereli Mod (Freeform Windows):** Aktif pencereli kullanım desteği.
            
            ### 📲 Kurulum (TWRP Recovery):
            1. Tabletinizi **TWRP Recovery** modunda başlatın.
            2. `Wipe` -> `Advanced Wipe` -> `Dalvik/ART Cache`, `Cache`, `System`, `Data` alanlarını temizleyin.
            3. İndirdiğiniz `.zip` dosyasını `Install` kısmından flashlayın.
            4. `Reboot System` deyin ve keyfini çıkarın!
          files: |
            workspace/SM-P580_UltraLite_iOS_Tuned_${{ github.event.inputs.release_tag }}.zip
            workspace/checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
